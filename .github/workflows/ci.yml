name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Qizhu.slnx --configfile NuGet.Config
      - run: dotnet build Qizhu.slnx --configuration Release --no-restore
      - run: dotnet test Qizhu.slnx --configuration Release --no-build --no-restore
      - run: dotnet format Qizhu.slnx --no-restore --verify-no-changes --severity warn
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run typecheck && npm run lint && npm run format:check && npm run test && npm run build
        working-directory: web
